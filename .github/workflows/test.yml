name: Test

on:
  push:
  pull_request:
  schedule:
    # Weekly, at 5:45 AM on Friday (somewhat randomly chosen).
    - cron: '45 5 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    strategy:
      # It's much easier to re-run as few jobs as possible:
      fail-fast: false
      matrix:
        platform: [x86, x64]
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest, windows-2022, windows-2025, windows-latest]
    runs-on: '${{ matrix.os }}'
    name: 'Test: ${{ matrix.os }} / ${{ matrix.platform }}'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean up PATH
        uses: egor-tensin/cleanup-path@cf0901d753db0bf4d15baf625a6fa537978b03a9 # v4
        if: runner.os == 'Windows'
      - name: Set up MinGW
        id: setup
        uses: ./
        with:
          platform: '${{ matrix.platform }}'
          cc: 1
      - name: Build foo.exe
        env:
          SETUP_GXX: ${{ steps.setup.outputs.gxx }}
        run: |
          & $env:SETUP_GXX -std=c++14 -o foo foo.cpp
      - name: Run foo.exe
        uses: ./.github/actions/run-foo
        if: runner.os == 'Windows'
      - name: Check cc/c++
        uses: ./.github/actions/check-cc

  different_versions:
    strategy:
      matrix:
        version:
          - 8.1.0
          - 12.2.0
          - 15.2.0
    runs-on: windows-latest
    name: 'Version: ${{ matrix.version }}'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean up PATH
        uses: egor-tensin/cleanup-path@cf0901d753db0bf4d15baf625a6fa537978b03a9 # v4
      - name: Set up MinGW
        id: setup
        uses: ./
        with:
          version: '${{ matrix.version }}'
      - name: Verify the version
        uses: ./.github/actions/check-cc
        with:
          version: '${{ matrix.version }}'
      - name: Build foo.exe
        env:
          SETUP_GXX: ${{ steps.setup.outputs.gxx }}
        run: |
          & $env:SETUP_GXX -std=c++14 -o foo foo.cpp
      - name: Run foo.exe
        uses: ./.github/actions/run-foo
