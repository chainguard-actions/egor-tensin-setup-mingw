name: Test MinGW install without static linking workaround
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "PowerShell already available: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          platform: x64
          cygwin: 0
          static: 0
          cc: 1

      - name: Assert gcc output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: gcc output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qE 'x86_64-w64-mingw32-gcc'; then
            echo "PASS: gcc output is correct"
          else
            echo "FAIL: gcc output '$ACTUAL' does not match expected pattern"
            exit 1
          fi

      - name: Assert libpthread.dll.a is still present (static=0 means no removal)
        run: |
          echo "Checking that libpthread.dll.a was NOT removed (static=0)..."
          LIB_PATH="/usr/x86_64-w64-mingw32/lib/libpthread.dll.a"
          if [ -f "$LIB_PATH" ]; then
            echo "PASS: $LIB_PATH still exists (static workaround was not applied)"
          else
            echo "INFO: $LIB_PATH not found - may not exist in this environment"
            echo "PASS: static workaround was not applied (file was not present to begin with)"
          fi

      - name: Assert mingw gcc binary is available
        run: |
          echo "Checking for x86_64-w64-mingw32-gcc..."
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: x86_64-w64-mingw32-gcc not found in PATH"
            exit 1
          fi
          echo "PASS: x86_64-w64-mingw32-gcc found at $(command -v x86_64-w64-mingw32-gcc)"

      - name: Assert cc symlink is set up
        run: |
          echo "Checking for cc symlink..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: cc not found in PATH"
            exit 1
          fi
          echo "PASS: cc found at $(command -v cc)"
