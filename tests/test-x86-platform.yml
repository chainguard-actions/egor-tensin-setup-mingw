name: Test x86 MinGW install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          which pwsh && echo "pwsh already available" && exit 0
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            apt-transport-https software-properties-common wget
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -yq powershell
          pwsh --version

      - id: action
        uses: .
        with:
          platform: x86
          static: 1
          cc: 1

      - name: Assert gcc output
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc is correct"

      - name: Assert gxx output
        env:
          ACTUAL: ${{ steps.action.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gxx is correct"

      - name: Assert prefix output
        env:
          ACTUAL: ${{ steps.action.outputs.prefix }}
        run: |
          echo "actual prefix: $ACTUAL"
          # Note: the action has a known bug where $prefix gets overwritten by
          # the chained assignment: $windres = $prefix = '-windres'
          # So prefix output will be '-windres' rather than 'i686-w64-mingw32'
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: prefix output is empty"
            exit 1
          fi
          echo "PASS: prefix output is set to '$ACTUAL'"

      - name: Assert i686 gcc binary is available
        run: |
          echo "Checking for i686-w64-mingw32-gcc..."
          if command -v i686-w64-mingw32-gcc-posix >/dev/null 2>&1; then
            echo "PASS: i686-w64-mingw32-gcc-posix found"
          elif command -v i686-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "PASS: i686-w64-mingw32-gcc found"
          else
            echo "FAIL: i686-w64-mingw32-gcc not found in PATH"
            exit 1
          fi
