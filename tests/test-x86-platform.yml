name: Test x86 (32-bit) platform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            apt-transport-https software-properties-common wget
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -yq powershell

      - id: action
        uses: .
        with:
          platform: x86
          cc: '0'

      - name: Assert prefix output for x86
        env:
          PREFIX: ${{ steps.action.outputs.prefix }}
        run: |
          echo "prefix: $PREFIX"
          if [ "$PREFIX" != "i686-w64-mingw32" ]; then
            echo "FAIL: expected prefix 'i686-w64-mingw32', got '$PREFIX'"
            exit 1
          fi
          echo "PASS: prefix is correct for x86"

      - name: Assert gcc output for x86
        env:
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "gcc: $GCC"
          if [ "$GCC" != "i686-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$GCC'"
            exit 1
          fi
          echo "PASS: gcc is correct for x86"

      - name: Assert gxx output for x86
        env:
          GXX: ${{ steps.action.outputs.gxx }}
        run: |
          echo "gxx: $GXX"
          if [ "$GXX" != "i686-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$GXX'"
            exit 1
          fi
          echo "PASS: gxx is correct for x86"

      - name: Assert windres output for x86
        env:
          WINDRES: ${{ steps.action.outputs.windres }}
        run: |
          echo "windres: $WINDRES"
          if [ "$WINDRES" != "i686-w64-mingw32-windres" ]; then
            echo "FAIL: expected windres 'i686-w64-mingw32-windres', got '$WINDRES'"
            exit 1
          fi
          echo "PASS: windres is correct for x86"

      - name: Assert i686 gcc binary is available on PATH
        run: |
          echo "Checking for i686-w64-mingw32-gcc on PATH..."
          if ! command -v i686-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: i686-w64-mingw32-gcc not found on PATH"
            exit 1
          fi
          echo "PASS: i686-w64-mingw32-gcc is available"
