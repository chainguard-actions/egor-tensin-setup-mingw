name: Test x86 (32-bit) platform setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          platform: x86
          cc: '1'
        continue-on-error: true

      - name: Assert action ran or failed gracefully (pwsh may not be available in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GCC: ${{ steps.action.outputs.gcc }}
          GXX: ${{ steps.action.outputs.gxx }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gcc: $GCC"
          echo "gxx: $GXX"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — validate outputs for x86 platform
            if [ -z "$GCC" ]; then
              echo "FAIL: action succeeded but gcc output is empty"
              exit 1
            fi
            if [ "$GCC" != "i686-w64-mingw32-gcc" ]; then
              echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$GCC'"
              exit 1
            fi
            if [ "$GXX" != "i686-w64-mingw32-g++" ]; then
              echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$GXX'"
              exit 1
            fi
            echo "PASS: x86 outputs are correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pwsh not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
