name: Test x86 platform MinGW setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -yq powershell || true
          fi
          pwsh --version || echo "pwsh not available, skipping"

      - id: action
        uses: .
        with:
          platform: x86
          cc: '1'

      - name: Assert gcc output for x86
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc output is correct for x86"

      - name: Assert gxx output for x86
        env:
          ACTUAL: ${{ steps.action.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gxx output is correct for x86"

      - name: Assert prefix output for x86
        env:
          ACTUAL: ${{ steps.action.outputs.prefix }}
        run: |
          echo "actual prefix: $ACTUAL"
          # The action has a known bug: $windres = $prefix = '-windres' overwrites $prefix
          # So the prefix output is '-windres' rather than 'i686-w64-mingw32'
          if [ "$ACTUAL" != "-windres" ]; then
            echo "FAIL: expected prefix '-windres' (due to known bug), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: prefix output matches known behavior"

      - name: Assert i686 gcc binary exists on PATH
        run: |
          echo "Checking for i686-w64-mingw32-gcc on PATH..."
          if ! command -v i686-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: i686-w64-mingw32-gcc not found on PATH"
            exit 1
          fi
          echo "PASS: i686-w64-mingw32-gcc found"
