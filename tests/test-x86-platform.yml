name: Test x86 (32-bit) MinGW setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:lts-ubuntu-22.04
    steps:
      - name: Install prerequisites (sudo, git)
        run: |
          apt-get update -yq
          apt-get install -yq --no-install-recommends sudo git
        shell: bash
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          platform: x86
          cc: '0'
      - name: Assert gcc output for x86
        env:
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "gcc: $GCC"
          if [ "$GCC" != "i686-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$GCC'"
            exit 1
          fi
          echo "PASS: gcc output is correct for x86"
        shell: bash
      - name: Assert gxx output for x86
        env:
          GXX: ${{ steps.action.outputs.gxx }}
        run: |
          echo "gxx: $GXX"
          if [ "$GXX" != "i686-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$GXX'"
            exit 1
          fi
          echo "PASS: gxx output is correct for x86"
        shell: bash
      - name: Assert gcc binary exists on PATH
        env:
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "Checking for gcc binary: $GCC"
          if ! command -v "$GCC" > /dev/null 2>&1; then
            echo "FAIL: $GCC not found on PATH"
            exit 1
          fi
          echo "PASS: $GCC found at $(command -v $GCC)"
        shell: bash
