name: Test x86 platform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pwsh is available
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq powershell || \
              (wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb && \
               sudo dpkg -i /tmp/packages-microsoft-prod.deb && \
               sudo apt-get update -q && \
               sudo apt-get install -yq powershell)
          fi
          pwsh --version
      - name: Pre-install mingw-w64 and set up alternatives
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 2>/dev/null || true
      - id: action
        uses: .
        with:
          platform: x86
          cc: 1
      - name: Assert gcc output
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'i686-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc is correct"
      - name: Assert gxx output
        env:
          ACTUAL: ${{ steps.action.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "i686-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'i686-w64-mingw32-g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gxx is correct"
      - name: Assert gcc binary exists
        run: |
          echo "Checking for i686-w64-mingw32-gcc..."
          if ! command -v i686-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: i686-w64-mingw32-gcc not found in PATH"
            exit 1
          fi
          echo "PASS: i686-w64-mingw32-gcc found"
      - name: Assert cc symlink exists
        run: |
          echo "Checking for cc symlink..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: cc not found in PATH"
            exit 1
          fi
          echo "PASS: cc found"
