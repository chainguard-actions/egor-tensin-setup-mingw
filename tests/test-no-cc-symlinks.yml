name: Test x64 setup without cc/c++ symlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          platform: x64
          cc: '0'
        continue-on-error: true

      - name: Assert action ran or failed gracefully (pwsh may not be available in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gcc: $GCC"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — validate outputs
            if [ -z "$GCC" ]; then
              echo "FAIL: action succeeded but gcc output is empty"
              exit 1
            fi
            if [ "$GCC" != "x86_64-w64-mingw32-gcc" ]; then
              echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$GCC'"
              exit 1
            fi
            # Verify cc symlink was NOT created (cc=0)
            if [ -f /usr/local/bin/cc ] || [ -L /usr/local/bin/cc ]; then
              echo "FAIL: /usr/local/bin/cc exists but cc=0 was set"
              exit 1
            fi
            if [ -f "/usr/local/bin/c++" ] || [ -L "/usr/local/bin/c++" ]; then
              echo "FAIL: /usr/local/bin/c++ exists but cc=0 was set"
              exit 1
            fi
            echo "PASS: gcc output correct and cc symlinks not created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pwsh not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
