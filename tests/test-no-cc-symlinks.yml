name: Test cc=0 no symlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pwsh is available
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq powershell || \
              (wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb && \
               sudo dpkg -i /tmp/packages-microsoft-prod.deb && \
               sudo apt-get update -q && \
               sudo apt-get install -yq powershell)
          fi
          pwsh --version
      - name: Pre-install mingw-w64 and set up alternatives
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 2>/dev/null || true
      - name: Remove any existing cc/c++ symlinks
        run: |
          sudo rm -f /usr/local/bin/cc /usr/local/bin/c++ || true
      - id: action
        uses: .
        with:
          platform: x64
          cc: 0
      - name: Assert gcc output
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc is correct"
      - name: Assert gcc binary exists
        run: |
          echo "Checking for x86_64-w64-mingw32-gcc..."
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: x86_64-w64-mingw32-gcc not found in PATH"
            exit 1
          fi
          echo "PASS: x86_64-w64-mingw32-gcc found"
      - name: Assert cc symlink was NOT created in /usr/local/bin
        run: |
          echo "Checking that /usr/local/bin/cc was not created by the action..."
          if [ -f /usr/local/bin/cc ] || [ -L /usr/local/bin/cc ]; then
            echo "FAIL: /usr/local/bin/cc exists but should not have been created with cc=0"
            exit 1
          fi
          echo "PASS: /usr/local/bin/cc not created"
      - name: Assert c++ symlink was NOT created in /usr/local/bin
        run: |
          echo "Checking that /usr/local/bin/c++ was not created by the action..."
          if [ -f /usr/local/bin/c++ ] || [ -L /usr/local/bin/c++ ]; then
            echo "FAIL: /usr/local/bin/c++ exists but should not have been created with cc=0"
            exit 1
          fi
          echo "PASS: /usr/local/bin/c++ not created"
