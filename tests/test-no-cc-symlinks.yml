name: Test cc=0 (no cc/c++ symlinks)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure PowerShell is available
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already available: $(pwsh --version)"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -yq curl apt-transport-https lsb-release
          UBUNTU_VERSION=$(lsb_release -rs 2>/dev/null || echo "22.04")
          MS_URL="https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb"
          curl -sSL "$MS_URL" -o /tmp/ms-prod.deb && dpkg -i /tmp/ms-prod.deb || true
          apt-get update -q
          apt-get install -yq powershell
          echo "Installed pwsh: $(pwsh --version)"

      - id: action
        uses: .
        with:
          platform: x64
          static: 0
          cc: 0

      - name: Assert gcc output is correct
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gcc binary is available
        run: |
          which x86_64-w64-mingw32-gcc || (echo "FAIL: x86_64-w64-mingw32-gcc not found in PATH"; exit 1)
          echo "PASS"

      - name: Assert cc symlink is NOT created
        run: |
          # When cc=0, the action should not create a cc symlink in /usr/local/bin
          # Note: there may be a system cc, so we check /usr/local/bin specifically
          if [ -f /usr/local/bin/cc ]; then
            echo "FAIL: /usr/local/bin/cc should not exist when cc=0"
            exit 1
          fi
          echo "PASS: /usr/local/bin/cc not created"

      - name: Assert c++ symlink is NOT created
        run: |
          if [ -f /usr/local/bin/c++ ]; then
            echo "FAIL: /usr/local/bin/c++ should not exist when cc=0"
            exit 1
          fi
          echo "PASS: /usr/local/bin/c++ not created"
