name: Test MinGW install without cc symlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          which pwsh && echo "pwsh already available" && exit 0
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            apt-transport-https software-properties-common wget
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -yq powershell
          pwsh --version

      - name: Remove any pre-existing cc symlink
        run: |
          sudo rm -f /usr/local/bin/cc /usr/local/bin/c++ || true

      - id: action
        uses: .
        with:
          platform: x64
          static: 1
          cc: 0

      - name: Assert gcc output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc output is correct"

      - name: Assert prefix output is set
        env:
          ACTUAL: ${{ steps.action.outputs.prefix }}
        run: |
          echo "actual prefix: $ACTUAL"
          # Note: the action has a known bug where $prefix gets overwritten by
          # the chained assignment: $windres = $prefix = '-windres'
          # So prefix output will be '-windres' rather than 'x86_64-w64-mingw32'
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: prefix output is empty"
            exit 1
          fi
          echo "PASS: prefix output is set to '$ACTUAL'"

      - name: Assert cc symlink was NOT created
        run: |
          echo "Checking that cc symlink was not created in /usr/local/bin..."
          if [ -f /usr/local/bin/cc ] || [ -L /usr/local/bin/cc ]; then
            echo "FAIL: cc symlink was created but cc=0 was specified"
            exit 1
          fi
          echo "PASS: cc symlink correctly absent"

      - name: Assert c++ symlink was NOT created
        run: |
          echo "Checking that c++ symlink was not created in /usr/local/bin..."
          if [ -f /usr/local/bin/c++ ] || [ -L /usr/local/bin/c++ ]; then
            echo "FAIL: c++ symlink was created but cc=0 was specified"
            exit 1
          fi
          echo "PASS: c++ symlink correctly absent"
