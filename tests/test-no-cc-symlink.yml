name: Test cc symlink disabled (cc=0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            apt-transport-https software-properties-common wget
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -yq powershell

      - name: Remove any pre-existing cc symlink from /usr/local/bin
        run: |
          sudo rm -f /usr/local/bin/cc /usr/local/bin/c++

      - id: action
        uses: .
        with:
          platform: x64
          cc: '0'

      - name: Assert prefix output is still set
        env:
          PREFIX: ${{ steps.action.outputs.prefix }}
        run: |
          echo "prefix: $PREFIX"
          if [ "$PREFIX" != "x86_64-w64-mingw32" ]; then
            echo "FAIL: expected prefix 'x86_64-w64-mingw32', got '$PREFIX'"
            exit 1
          fi
          echo "PASS: prefix is correct"

      - name: Assert gcc output is still set
        env:
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "gcc: $GCC"
          if [ "$GCC" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$GCC'"
            exit 1
          fi
          echo "PASS: gcc output is correct"

      - name: Assert cc symlink was NOT created in /usr/local/bin
        run: |
          echo "Checking that /usr/local/bin/cc was NOT created..."
          if [ -e /usr/local/bin/cc ]; then
            TARGET="$(readlink -f /usr/local/bin/cc 2>/dev/null || echo 'non-symlink')"
            echo "FAIL: /usr/local/bin/cc exists (points to $TARGET) but cc=0 was set"
            exit 1
          fi
          echo "PASS: /usr/local/bin/cc was not created as expected"

      - name: Assert c++ symlink was NOT created in /usr/local/bin
        run: |
          echo "Checking that /usr/local/bin/c++ was NOT created..."
          if [ -e /usr/local/bin/c++ ]; then
            TARGET="$(readlink -f /usr/local/bin/c++ 2>/dev/null || echo 'non-symlink')"
            echo "FAIL: /usr/local/bin/c++ exists (points to $TARGET) but cc=0 was set"
            exit 1
          fi
          echo "PASS: /usr/local/bin/c++ was not created as expected"
