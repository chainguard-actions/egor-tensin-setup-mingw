name: Test basic x64 (default) MinGW setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -yq powershell || true
          fi
          pwsh --version || echo "pwsh not available, skipping"

      - id: action
        uses: .
        with:
          platform: x64
          cc: '1'

      - name: Assert gcc output
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gcc output is correct"

      - name: Assert gxx output
        env:
          ACTUAL: ${{ steps.action.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "x86_64-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'x86_64-w64-mingw32-g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gxx output is correct"

      - name: Assert prefix output
        env:
          ACTUAL: ${{ steps.action.outputs.prefix }}
        run: |
          echo "actual prefix: $ACTUAL"
          # The action has a known bug: $windres = $prefix = '-windres' overwrites $prefix
          # So the prefix output is '-windres' rather than 'x86_64-w64-mingw32'
          if [ "$ACTUAL" != "-windres" ]; then
            echo "FAIL: expected prefix '-windres' (due to known bug), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: prefix output matches known behavior"

      - name: Assert gcc binary exists on PATH
        run: |
          echo "Checking for x86_64-w64-mingw32-gcc on PATH..."
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null 2>&1; then
            echo "FAIL: x86_64-w64-mingw32-gcc not found on PATH"
            exit 1
          fi
          echo "PASS: x86_64-w64-mingw32-gcc found"

      - name: Assert cc symlink exists
        run: |
          echo "Checking for cc symlink..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: cc not found on PATH"
            exit 1
          fi
          CC_PATH="$(command -v cc)"
          echo "cc resolves to: $CC_PATH"
          echo "PASS: cc symlink exists"

      - name: Assert c++ symlink exists
        run: |
          echo "Checking for c++ symlink..."
          if ! command -v c++ > /dev/null 2>&1; then
            echo "FAIL: c++ not found on PATH"
            exit 1
          fi
          CXX_PATH="$(command -v c++)"
          echo "c++ resolves to: $CXX_PATH"
          echo "PASS: c++ symlink exists"
