name: Test cc setup disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure PowerShell is available
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already available: $(pwsh --version)"
          else
            echo "Installing PowerShell..."
            UBUNTU_VERSION=$(lsb_release -rs 2>/dev/null || echo "22.04")
            wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" \
              -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
            echo "Installed: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          platform: x64
          cc: '0'

      - name: Assert gcc output is set
        env:
          GCC: ${{ steps.action.outputs.gcc }}
        run: |
          echo "gcc: $GCC"
          if [ -z "$GCC" ]; then
            echo "FAIL: gcc output is empty"
            exit 1
          fi
          if [ "$GCC" != "x86_64-w64-mingw32-gcc" ]; then
            echo "FAIL: expected gcc 'x86_64-w64-mingw32-gcc', got '$GCC'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gxx output is set
        env:
          GXX: ${{ steps.action.outputs.gxx }}
        run: |
          echo "gxx: $GXX"
          if [ -z "$GXX" ]; then
            echo "FAIL: gxx output is empty"
            exit 1
          fi
          if [ "$GXX" != "x86_64-w64-mingw32-g++" ]; then
            echo "FAIL: expected gxx 'x86_64-w64-mingw32-g++', got '$GXX'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cc symlink was NOT created by this action
        run: |
          # When cc=0, the action should not create a cc symlink pointing to mingw gcc.
          # Note: /usr/bin/cc may exist as a system cc, but /usr/local/bin/cc should not.
          if [ -L /usr/local/bin/cc ]; then
            echo "FAIL: /usr/local/bin/cc symlink was created but cc=0"
            exit 1
          fi
          echo "PASS: no /usr/local/bin/cc symlink created"

      - name: Assert c++ symlink was NOT created by this action
        run: |
          if [ -L /usr/local/bin/c++ ]; then
            echo "FAIL: /usr/local/bin/c++ symlink was created but cc=0"
            exit 1
          fi
          echo "PASS: no /usr/local/bin/c++ symlink created"
